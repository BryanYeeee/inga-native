name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Django + Postgres)
    runs-on: ubuntu-latest

    # Same image as docker-compose, so CI and local run the same database.
    services:
      postgres:
        image: postgis/postgis:latest
        env:
          POSTGRES_DB: inga
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # psycopg2 in requirements.txt builds from source and needs libpq headers.
      - name: Install libpq
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpq-dev

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e .

      # The repo keeps environment settings in .env.local, which is gitignored.
      - name: Write .env.local
        run: |
          cat > .env.local <<'ENV'
          DATABASE_URL=postgres://postgres:postgres@localhost:5432/inga
          DJANGO_SECRET_KEY=ci-only-key-not-used-anywhere-else
          DJANGO_DEBUG=false
          DJANGO_SETTINGS_MODULE=config.settings
          DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1
          ENV

      - name: Django system checks
        run: python src/manage.py check --fail-level WARNING

      - name: Fail if a model change has no migration
        run: python src/manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: python src/manage.py migrate

      - name: Tests
        run: python -m pytest

  frontend:
    name: Frontend (Expo + TypeScript)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint -- --max-warnings=0
